    <script>
      // Paint the stored theme before React boots so there's no flash.
      // React itself starts in light mode and adopts the preference after
      // hydration, which keeps the server and client markup identical.
      try {
        var stored = localStorage.getItem("vaanya-theme");
        document.documentElement.setAttribute(
          "data-theme",
          stored === "dark" ? "dark" : "light"
        );
      } catch (e) {}
    </script>
